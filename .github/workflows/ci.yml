name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  install-from-git:
    # The documented install path: npm straight from this repository (builds via "prepare").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir consumer && cd consumer && npm init -y >/dev/null
          npm install "github:${{ github.repository }}#${{ github.sha }}"
          node --input-type=module -e 'import { FeedbackClient } from "@xpo/feedback"; console.log(typeof FeedbackClient)'
